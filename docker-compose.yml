version: '3.8'

services:
  hub:
    build: .
    container_name: aelflab-hub
    ports:
      - "8081:8081"
    restart: unless-stopped
    environment:
      - HERMES_HOME=/hermes
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - D:\homelab\hermes\cron:/hermes/cron:ro
      - D:\homelab\hermes\.env:/hermes/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redirect:
    image: nginx:alpine
    container_name: aelflab-redirect
    ports:
      - "8082:80"
    restart: unless-stopped
    volumes:
      - ./redirect.conf:/etc/nginx/conf.d/default.conf:ro
